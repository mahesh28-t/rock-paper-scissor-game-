
<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="dream.css">
</head>

<body>

    <div class="background">

        <h1 id="heading">ROCK PAPER SCISSORS</h1>

        <p id="result"></p>

        <p id="score"></p>


     
        <button onclick="
            pick();

            let result = '';

            if (computermove == 'rock') {
                result = 'tie';
            }
            else if (computermove == 'paper') {
                result = 'lose';
            }
            else if (computermove == 'scissor') {
                result = 'win';
            }

            if (result === 'win') {
                score.win += 1;
            }
            else if (result === 'lose') {
                score.lose += 1;
            }
            else if (result === 'tie') {
                score.tie += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            document.getElementById('result').innerText = result;

            document.getElementById('score').innerText =
                `Wins: ${score.win} | Losses: ${score.lose} | Ties: ${score.tie}`;

            console.log(result);
        ">
            Rock
        </button>


        <button onclick="
            pick();

            let result = '';

            if (computermove == 'rock') {
                result = 'win';
            }
            else if (computermove == 'paper') {
                result = 'tie';
            }
            else if (computermove == 'scissor') {
                result = 'lose';
            }

            if (result === 'tie') {
                score.tie += 1;
            }
            else if (result === 'win') {
                score.win += 1;
            }
            else if (result === 'lose') {
                score.lose += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            document.getElementById('result').innerText = result;

            document.getElementById('score').innerText =
                `Wins: ${score.win} | Losses: ${score.lose} | Ties: ${score.tie}`;

            console.log(result);
        ">
            Paper
        </button>


        <!-- SCISSOR BUTTON -->
        <button onclick="
            pick();

            let result = '';

            if (computermove == 'rock') {
                result = 'lose';
            }
            else if (computermove == 'paper') {
                result = 'win';
            }
            else if (computermove == 'scissor') {
                result = 'tie';
            }

            if (result === 'lose') {
                score.lose += 1;
            }
            else if (result === 'win') {
                score.win += 1;
            }
            else if (result === 'tie') {
                score.tie += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            document.getElementById('result').innerText = result;

            document.getElementById('score').innerText =
                `Wins: ${score.win} | Losses: ${score.lose} | Ties: ${score.tie}`;

            console.log(result);
        ">
            Scissor
        </button>


        <!-- RESET BUTTON -->
        <button onclick="
            score.win = 0;
            score.lose = 0;
            score.tie = 0;

            localStorage.setItem('score', JSON.stringify(score));

            document.getElementById('result').innerText = '';

            document.getElementById('score').innerText =
                `Wins: ${score.win} | Losses: ${score.lose} | Ties: ${score.tie}`;
        ">
            Reset Score
        </button>


    </div>


    <script>

        let computermove = '';

        function pick() {

            let randomnumber = Math.random();

            if (randomnumber >= 0 && randomnumber < 1 / 3) {
                computermove = 'rock';
            }
            else if (randomnumber >= 1 / 3 && randomnumber < 2 / 3) {
                computermove = 'paper';
            }
            else {
                computermove = 'scissor';
            }

        }



        const score = JSON.parse(localStorage.getItem('score')) || {
            win: 0,
            lose: 0,
            tie: 0
        };


      

        document.getElementById('score').innerText =
            `Wins: ${score.win} | Losses: ${score.lose} | Ties: ${score.tie}`;

        console.log(score);

    </script>

</body>

</html>
